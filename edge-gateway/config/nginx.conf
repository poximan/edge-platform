worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    include /etc/nginx/generated/protected-users.map;

    map $http_cookie $has_protected_mode {
        default 0;
        "~*panelexemys_mode=protected" 1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server {
        listen 8081;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        root /usr/share/nginx/html;
        index index.html;

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location = /mode/secure {
            limit_except POST { deny all; }
            add_header Set-Cookie "panelexemys_mode=secure; Path=/; HttpOnly; SameSite=Lax" always;
            return 204;
        }

        location = /mode/protected {
            limit_except POST { deny all; }
            if ($http_x_mode_user = "") { return 403; }
            if ($http_x_mode_pass = "") { return 403; }
            if ($protected_mode_expected_pass = "") { return 403; }
            if ($http_x_mode_pass != $protected_mode_expected_pass) { return 403; }
            add_header Set-Cookie "panelexemys_mode=protected; Path=/; HttpOnly; SameSite=Lax" always;
            return 204;
        }

        include /etc/nginx/generated/public-locations.conf;

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /error.html;
        location = /error.html {
            internal;
        }
    }

    include /etc/nginx/generated/internal-servers.conf;
}
