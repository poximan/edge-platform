worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $server_port $edge_forwarded_port {
        default $server_port;
        8443 443;
    }

    map $server_port $edge_forwarded_host {
        default $host;
        8443 comunicaciones.servicoop.com.ar;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    limit_req_zone $binary_remote_addr zone=protected_login:10m rate=5r/m;

    server {
        listen 8081;
        server_name _;
        return 301 https://comunicaciones.servicoop.com.ar$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        root /usr/share/nginx/html;
        index index.html;

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location = /mode/secure {
            limit_except POST { deny all; }
            proxy_pass http://edge-auth:8085/secure;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /mode/protected {
            limit_except POST { deny all; }
            limit_req zone=protected_login burst=3 nodelay;
            proxy_pass http://edge-auth:8085/login;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Mode-User $http_x_mode_user;
            proxy_set_header X-Mode-Pass $http_x_mode_pass;
        }

        location = /logout {
            proxy_pass http://edge-auth:8085/logout;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /__edge_auth_session {
            internal;
            proxy_pass http://edge-auth:8085/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location = /__edge_auth_verify {
            internal;
            proxy_pass http://edge-auth:8085/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location @edge_auth_redirect {
            return 302 /;
        }

        include /etc/nginx/generated/public-locations.conf;

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /error.html;
        location = /error.html {
            internal;
        }
    }

    include /etc/nginx/generated/internal-servers.conf;
}
