worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $server_port $edge_forwarded_port {
        default $server_port;
        8081 443;
    }

    map $server_port $edge_forwarded_host {
        default $host;
        8081 $host;
    }

    map $server_port $edge_forwarded_proto {
        default $scheme;
        8081 https;
    }

    map $server_port $edge_client_ip {
        default $remote_addr;
        8081 $http_x_forwarded_for;
    }

    limit_req_zone $edge_client_ip zone=protected_login:10m rate=5r/m;
    limit_req_zone $edge_client_ip zone=portal_events:1m rate=5r/s;

    map $request_uri $client_path {
        ~^(?<client_original_path>[^?]*) $client_original_path;
    }
    log_format client_events escape=json
        '{"ip":"$edge_client_ip","path":"$client_path","method":"$request_method",'
        '"status":$status,"content_type":"$sent_http_content_type","complete":"$request_completion"}';

    server {
        listen 8081;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        root /usr/share/nginx/html;
        index index.html;
        access_log /dev/stdout;
        access_log syslog:server=resource-monitor:8093,tag=webclients,nohostname client_events;

        location = / {
            auth_request /__edge_landing;
            try_files /index.html =404;
        }

        location = /index.html { return 302 /; }

        location = /__edge_landing {
            internal;
            proxy_pass http://edge-auth:8085/landing;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Edge-Client-IP $edge_client_ip;
        }

        location = /portal/events {
            limit_except POST { deny all; }
            limit_req zone=portal_events burst=20 nodelay;
            client_max_body_size 4096;
            proxy_pass http://edge-auth:8085/events;
            proxy_set_header X-Edge-Client-IP $edge_client_ip;
            proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
            proxy_set_header X-Forwarded-Host $edge_forwarded_host;
        }

        location ^~ /recursos/internal/ { return 404; }

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location = /mode/secure {
            limit_except POST { deny all; }
            proxy_pass http://edge-auth:8085/secure;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /mode/protected {
            limit_except POST { deny all; }
            limit_req zone=protected_login burst=3 nodelay;
            proxy_pass http://edge-auth:8085/login;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Mode-User $http_x_mode_user;
            proxy_set_header X-Mode-Pass $http_x_mode_pass;
        }

        location = /mode/session {
            limit_except GET { deny all; }
            proxy_pass http://edge-auth:8085/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location = /mode/kite-cat {
            limit_except POST { deny all; }
            limit_req zone=protected_login burst=3 nodelay;
            proxy_pass http://edge-auth:8085/kite-cat/login;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Mode-User $http_x_mode_user;
            proxy_set_header X-Mode-Pass $http_x_mode_pass;
        }

        location = /logout {
            proxy_pass http://edge-auth:8085/logout;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /__edge_auth_session {
            internal;
            proxy_pass http://edge-auth:8085/session;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Edge-Client-IP $edge_client_ip;
            proxy_set_header X-Edge-Original-URI $request_uri;
            proxy_set_header X-Edge-Public 1;
        }

        location = /__edge_auth_verify {
            internal;
            proxy_pass http://edge-auth:8085/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Edge-Client-IP $edge_client_ip;
            proxy_set_header X-Edge-Original-URI $request_uri;
            proxy_set_header X-Edge-Public 1;
        }

        location @edge_auth_redirect {
            return 302 /;
        }

        include /etc/nginx/generated/public-locations.conf;

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /error.html;
        location = /error.html {
            internal;
        }
    }

    include /etc/nginx/generated/internal-servers.conf;
}
